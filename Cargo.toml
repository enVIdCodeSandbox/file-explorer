[workspace]
resolver = "2"
members = ["crates/fast-core", "src-tauri"]

[workspace.package]
version = "37.17.0"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
# Parallel LLVM codegen across units; ThinLTO still optimizes across them.
codegen-units = 16
strip = true
panic = "abort"

# Image decoding is the hot path for thumbnails; keep it fast in dev builds too.
[profile.dev.package.image]
opt-level = 3
