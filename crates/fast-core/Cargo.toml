[package]
name = "fast-core"
description = "UI-agnostic engine for FAST File Explorer: listing, indexing, search, transfers, analysis."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
thiserror = "2"
rayon = "1"
memchr = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
base64 = "0.22"
getrandom = "0.3"
filetime = "0.2"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
regex = "1"
similar = "2"
mime_guess = "2"
imagesize = "0.13"
# Photo, audio and video details
kamadak-exif = "0.6"
lofty = "0.25"
mp4 = "0.14"
# Servers: FTP, SFTP (SSH) and WebDAV
suppaftp = "12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
quick-xml = "0.42"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["fs", "rt", "rt-multi-thread", "net", "io-util", "time", "sync"] }
# Archives
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
tar = { version = "0.4", default-features = false }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "deflate"] }
bzip2-rs = "0.1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "xz"] }
lzma-rs = "0.3"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
argon2 = "0.5"

# Desktop-only dependencies. Mobile builds get reduced-feature fallbacks.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Terminal sessions (a pseudo-terminal on Unix, ConPTY on Windows).
portable-pty = "0.9"
# Phones over USB. Its USB layer cannot list devices on Android, and a phone has no use for it.
mtp-rs = "0.38"
sysinfo = { version = "0.33", default-features = false, features = ["disk", "system"] }
dirs = "6"
trash = "5"
open = "5"
reflink-copy = "0.1"
starship-battery = "0.10"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# "Show in folder" requests from other apps (org.freedesktop.FileManager1).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# Launch Services: being the app that opens folders.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WNet",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The system's own right-click menu (entries added by other programs).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
mtp-rs = { version = "0.38", features = ["virtual-device"] }
