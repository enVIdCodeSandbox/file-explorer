[package]
name = "fast-file-explorer"
description = "FAST File Explorer"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "fast-file-explorer"

[lib]
name = "fast_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fast-core = { path = "../crates/fast-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Desktop only: system clipboard with files, and dragging files out to other apps.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
clipboard-rs = "0.3"
drag = "2"
tauri-plugin-single-instance = "2"
ureq = "3"
