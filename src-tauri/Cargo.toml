[package]
name = "fast-file-explorer"
description = "FAST File Explorer"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "fast-file-explorer"

[lib]
name = "fast_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rayon = "1"
fast-core = { path = "../crates/fast-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "network", "component", "disk"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSImage",
    "NSPasteboard",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSGeometry",
    "NSObject",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }

# Desktop only: system clipboard with files, and dragging files out to other apps.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
clipboard-rs = "0.3"
open = "5"
drag = "2"
tauri-plugin-single-instance = "2"
ureq = "3"

[dev-dependencies]
tempfile = "3"
