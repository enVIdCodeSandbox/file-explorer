name: Build

# Tests on every push and pull request and builds for every supported platform. When
# everything on the main branch has built, the installers are posted on the Releases page as
# "FAST File Explorer <version>" (the version in package.json; raise it with `npm run bump`),
# with GitHub's own change list as the notes. The Android .apk and the unsigned iOS .ipa
# (mobile.yml) are attached to the same release. A version that is already published is left alone.
# A tag pushed by hand also works:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# You can also run it by hand from the Actions tab ("Run workflow").

on:
  push:
    branches: [main, tauri-rewrite]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Linux gates the build. Windows and macOS results are reported but do not
    # block the builds, so one platform-specific test cannot stop a release.
    continue-on-error: ${{ matrix.os != 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # The engine has no system dependencies, so it is tested on every OS.
      # The desktop shell is also compiled and tested where its libraries exist.
      - name: Test the engine
        if: "!startsWith(matrix.os, 'ubuntu')"
        run: cargo test -p fast-core
      - name: Test the engine and the desktop shell
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo test --workspace
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  bundle:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 (.deb .rpm .AppImage)
            artifact: linux-x64
            os: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
            targets: ""
          - name: Windows x64 (.msi .exe)
            artifact: windows-x64
            os: windows-latest
            args: "--bundles nsis,msi"
            targets: ""
          - name: macOS universal (.dmg, Apple silicon and Intel)
            artifact: macos-universal
            os: macos-latest
            args: "--target universal-apple-darwin --bundles dmg,app"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # These two need runners that not every account has, or a toolchain
          # the runner image may lack. A failure here does not fail the run.
          - name: Windows ARM64 (.exe)
            artifact: windows-arm64
            os: windows-latest
            args: "--target aarch64-pc-windows-msvc --bundles nsis"
            targets: "aarch64-pc-windows-msvc"
            optional: true
          - name: Linux ARM64 (.deb .rpm .AppImage)
            artifact: linux-arm64
            os: ubuntu-22.04-arm
            args: "--bundles deb,rpm,appimage"
            targets: ""
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    env:
      # AppImage tooling runs without FUSE on CI machines.
      APPIMAGE_EXTRACT_AND_RUN: 1
      # Signing. Every one of these is optional: without the secrets the
      # builds are made unsigned, exactly as before. See docs/RELEASING.md.
      # macOS: signs the app and, with the Apple ID values, notarizes it.
      # Windows: a code signing certificate as a base64 .pfx.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # macOS: try the signing certificate in a throwaway keychain first. If it cannot be
      # imported (wrong base64, wrong password, no private key) the build goes ahead
      # unsigned with a warning, instead of failing at the very end.
      - name: Set up macOS signing
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_VALUE: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The signing variables are only created when there is a certificate, and only when it
          # imports. A variable that exists but is empty makes the build try to sign with nothing
          # and fail at the very end; leaving them out builds the app unsigned.
          if [ -z "$CERT" ]; then
            echo "No APPLE_CERTIFICATE secret: building the macOS app unsigned."
            exit 0
          fi
          ok=0
          if echo "$CERT" | base64 --decode > "$RUNNER_TEMP/check.p12" 2>/dev/null; then
            security create-keychain -p check "$RUNNER_TEMP/check.keychain"
            if security import "$RUNNER_TEMP/check.p12" -k "$RUNNER_TEMP/check.keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign >/dev/null 2>&1; then ok=1; fi
            security delete-keychain "$RUNNER_TEMP/check.keychain" || true
          fi
          rm -f "$RUNNER_TEMP/check.p12"
          if [ "$ok" != 1 ]; then
            echo "::warning::The APPLE_CERTIFICATE secret could not be imported (it must be a base64 .p12 with its private key, and APPLE_CERTIFICATE_PASSWORD must match). Building the macOS app unsigned. See docs/RELEASING.md."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            [ -n "$IDENTITY" ] && echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            if [ -n "$APPLE_ID_VALUE" ] && [ -n "$APPLE_PASSWORD_VALUE" ] && [ -n "$TEAM_ID" ]; then
              echo "APPLE_ID=$APPLE_ID_VALUE"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD_VALUE"
              echo "APPLE_TEAM_ID=$TEAM_ID"
            fi
          } >> "$GITHUB_ENV"
      # Windows: put the certificate where the signing tool finds it, and tell
      # the build which one to use. Skipped when no certificate is configured.
      - name: Import the Windows signing certificate
        id: wincert
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $path = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $path
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Build packages (signed)
        if: steps.wincert.outputs.thumbprint != ''
        shell: pwsh
        run: |
          $config = '{"bundle":{"windows":{"certificateThumbprint":"${{ steps.wincert.outputs.thumbprint }}","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}'
          npx tauri build ${{ matrix.args }} --config $config
      - name: Build packages
        if: steps.wincert.outputs.thumbprint == ''
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: fast-file-explorer-build-${{ matrix.artifact }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/*/release/bundle/**/*.deb
            target/*/release/bundle/**/*.rpm
            target/*/release/bundle/**/*.AppImage
            target/*/release/bundle/**/*.msi
            target/*/release/bundle/**/*.exe
            target/*/release/bundle/**/*.dmg
          if-no-files-found: error

  # Android (.apk) and iPhone/iPad (unsigned .ipa): built in the same run so they are on the
  # same release as the installers. See mobile.yml. Not built for pull requests.
  mobile:
    name: Mobile
    needs: test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/mobile.yml
    secrets: inherit

  release:
    name: Publish release
    needs: [bundle, mobile]
    # Only real builds of the main line: not pull requests, not side branches. A version tag
    # pushed by hand (git tag v0.3.0 && git push origin v0.3.0) is published the same way.
    # The desktop installers are required. The phone packages are attached when they built;
    # if one of them failed the release is still published without it, with a warning.
    if: ${{ !cancelled() && needs.bundle.result == 'success' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: build-files
          merge-multiple: true
      - name: Check that every installer is there
        run: |
          find build-files -type f | sort
          missing=0
          for pattern in '*x64-setup.exe' '*x64_en-US.msi' '*.AppImage' '*.deb' '*.rpm' '*universal.dmg'; do
            if ! find build-files -type f -iname "$pattern" | grep -q .; then
              echo "::error::No installer matching $pattern: not publishing."
              missing=1
            fi
          done
          for pattern in '*.apk' '*.ipa'; do
            if ! find build-files -type f -iname "$pattern" | grep -q .; then
              echo "::warning::No $pattern was built (see the Mobile jobs): publishing without it."
            fi
          done
          exit $missing
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            TARGET=()
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v$VERSION"
            TARGET=(--target "$GITHUB_SHA")
          fi
          # Only the installers themselves: the downloaded builds sit in folders named after
          # their target, and a folder cannot be attached to a release.
          mapfile -t FILES < <(find build-files -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.deb' -o -iname '*.rpm' -o -iname '*.AppImage' -o -iname '*.dmg' -o -iname '*.apk' -o -iname '*.ipa' \) | sort)
          echo "Attaching ${#FILES[@]} files:"; printf '  %s\n' "${FILES[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            have="$(gh release view "$TAG" --json assets --jq '.assets | length')"
            if [ "$have" -ge "${#FILES[@]}" ]; then
              echo "$TAG is already published with its $have files (the version was not raised), so nothing new is posted."
              exit 0
            fi
            # A release left half-finished by an earlier run that stopped while attaching files.
            echo "$TAG exists with only $have of ${#FILES[@]} files: replacing it."
            # (A tag that was pushed by hand stays; one the workflow made is made again below.)
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then gh release delete "$TAG" --yes; else gh release delete "$TAG" --yes --cleanup-tag; fi
          fi
          # Built as a draft and published only once every file is attached, so a failure in
          # the middle never leaves a half-empty release on the page. The description opens with
          # the name and version; GitHub's own change list follows it.
          gh release create "$TAG" "${FILES[@]}" "${TARGET[@]}" --draft \
            --title "FAST File Explorer $VERSION" \
            --notes "FAST File Explorer $VERSION" \
            --generate-notes
          gh release edit "$TAG" --draft=false
